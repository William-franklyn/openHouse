services:
  - type: web
    name: openhouse-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/rooms/by-code/ZZZZZ
    envVars:
      # Postgres comes from Neon (neon.tech), not Render - Render's free
      # Postgres expires after 30 days, Neon's free tier doesn't expire.
      # Paste Neon's connection string in as-is; app/db.py normalizes the
      # driver and strips the sslmode/channel_binding params asyncpg
      # doesn't understand.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: openhouse-redis
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: APP_NAME
        value: Openhouse
      - key: ROOM_WORD
        value: Room
      - key: APP_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto

  - type: keyvalue
    name: openhouse-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
